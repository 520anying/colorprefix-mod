buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://files.minecraftforge.net/maven' }
    }
    dependencies {
        classpath group: 'net.minecraftforge.gradle', name: 'ForgeGradle', version: '5.1.+', changing: true
    }
}

plugins {
    id 'java'
}

apply plugin: 'net.minecraftforge.gradle'

version = '1.0.0'
group = 'net.undertaker.colorprefix'
archivesBaseName = 'colorprefix'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.19.2'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.mojang_level', 'info'
            mods {
                colorprefix {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.mojang_level', 'info'
            mods {
                colorprefix {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.luckperms.net/releases' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.19.2-43.3.0'
    compileOnly 'net.luckperms:api:5.4'
}

// 自定义 jar 任务，强制包含编译后的 class 文件和资源文件
tasks.jar {
    from sourceSets.main.output
    from sourceSets.main.resources
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
            "Specification-Title": "colorprefix",
            "Specification-Vendor": "undertaker",
            "Specification-Version": "1",
            "Implementation-Title": project.name,
            "Implementation-Version": project.version,
            "Implementation-Vendor": "undertaker",
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// 确保 reobfJar 使用我们的 jar 输出
reobf {
    jar {}
}
